<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Hiring process from role to hire</title><desc id="desc">Original illustration showing a hiring need becoming a shortlist and then a direct hire.</desc><defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#e1faf6"/></linearGradient></defs><rect width="900" height="650" rx="46" fill="url(#bg4)"/><path d="M173 334H727" stroke="#9dc7e9" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 20"/><g transform="translate(76 196)"><rect width="214" height="280" rx="30" fill="#fff" stroke="#d5e4f0"/><circle cx="107" cy="77" r="42" fill="#c68968"/><path d="M64 75c2-36 18-55 43-55 27 0 43 19 44 53-11-14-26-21-44-21-18 0-32 8-43 23Z" fill="#282030"/><path d="M51 166c12-52 35-76 56-76 24 0 48 26 58 76v8H51Z" fill="#0b66c3"/><text x="107" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10253f">You need help</text><text x="107" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#617487">Tell us the work.</text></g><g transform="translate(343 145)"><rect width="214" height="350" rx="30" fill="#10253f"/><circle cx="107" cy="79" r="43" fill="#b97859"/><path d="M65 76c1-38 18-57 42-57 28 0 44 20 44 56-10-15-25-22-44-22-18 0-32 7-42 23Z" fill="#1d1725"/><path d="M51 171c11-52 35-78 56-78 24 0 49 27 58 78v8H51Z" fill="#2dd4bf"/><text x="107" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">We recruit</text><g font-family="Arial,sans-serif" font-size="12" fill="#c5d5e2"><text x="54" y="252">✓ Source</text><text x="54" y="277">✓ Interview</text><text x="54" y="302">✓ Assess</text><text x="54" y="327">✓ Shortlist</text></g></g><g transform="translate(610 196)"><rect width="214" height="280" rx="30" fill="#fff" stroke="#d5e4f0"/><circle cx="80" cy="89" r="33" fill="#ca8b68"/><path d="M47 86c2-31 14-46 34-46 21 0 34 16 35 44-8-10-20-16-35-16-14 0-25 6-34 18Z" fill="#202030"/><circle cx="132" cy="89" r="33" fill="#9f6650"/><path d="M99 86c2-31 14-46 34-46 21 0 34 16 35 44-8-10-20-16-35-16-14 0-25 6-34 18Z" fill="#3b2732"/><path d="M38 168c10-42 25-62 43-62 18 0 33 19 44 62Z" fill="#0b66c3"/><path d="M89 168c11-43 26-62 44-62 19 0 34 20 44 62Z" fill="#2dd4bf"/><text x="107" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10253f">You choose</text><text x="107" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#617487">They join your team.</text></g><g transform="translate(285 525)"><rect width="330" height="66" rx="22" fill="#fff" stroke="#d5e4f0"/><circle cx="39" cy="33" r="19" fill="#2dd4bf"/><path d="m30 33 6 6 12-14" fill="none" stroke="#10253f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="29" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10253f">Direct hire. No staffing layer.</text><text x="70" y="49" font-family="Arial,sans-serif" font-size="12" fill="#617487">The person works for your company.</text></g></svg>
